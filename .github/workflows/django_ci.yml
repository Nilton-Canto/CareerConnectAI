name: Django CI - Testes Automatizados

# Quando este robô deve trabalhar?
on:
  push:
    branches: [ "main", "develop" ] # Quando der push nessas branches
  pull_request:
    branches: [ "main", "develop" ] # Quando abrir PR para essas branches

jobs:
  build-and-test:
    runs-on: ubuntu-latest # Usa uma máquina Linux virtual

    steps:
    # 1. Baixa o seu código
    - uses: actions/checkout@v3

    # 2. Instala o Python
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    # 3. Instala as dependências
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Roda os Testes
    - name: Run Tests
      # Define variáveis de ambiente falsas apenas para o teste não reclamar
      # (Como usamos Mock nos testes, não precisamos das chaves reais aqui)
      env:
        GEMINI_API_KEY: "chave_falsa_para_ci"
        OPENAI_API_KEY: "chave_falsa_para_ci"
        SECRET_KEY: "chave_falsa_para_django"
      run: |
        python manage.py test