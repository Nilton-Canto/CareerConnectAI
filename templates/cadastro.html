{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - CareerConnectAI</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <div class="login-container">
        <header>
            <h1>Crie sua conta</h1>
            <p style="text-align: center; color: #666;">Junte-se ao CareerConnectAI</p>
        </header>

        <main>
            <form id="registerForm">
                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required placeholder="seu@email.com">
                </div>

                <div class="form-group">
                    <label for="password">Senha:</label>
                    <input type="password" id="password" name="password" required placeholder="Mínimo 8 caracteres">
                </div>

                <div class="form-group">
                    <label for="password_confirm">Confirmar Senha:</label>
                    <input type="password" id="password_confirm" name="password_confirm" required>
                </div>
                
                <div class="form-group">
                    <button type="submit" class="button-primary">Cadastrar</button>
                </div>
                <div id="msg-area" style="text-align: center; margin-top: 10px;"></div>
                
                <p style="text-align: center; margin-top: 20px;">
                    Já tem conta? <a href="/api/users/login/">Fazer Login</a>
                </p>
            </form>
        </main>
    </div>

    <script>
        const form = document.getElementById('registerForm');
        const msgArea = document.getElementById('msg-area');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            msgArea.textContent = 'Cadastrando...';
            msgArea.style.color = '#333';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const password_confirm = document.getElementById('password_confirm').value;

            try {
                // Chama a API de Cadastro que criamos na Tarefa #19
                // Note a URL: /api/users/api/cadastro (conforme seu urls.py)
                const response = await fetch('/api/users/api/cadastro', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        email: email, 
                        password: password,
                        password_confirm: password_confirm,
                        // O username será gerado automaticamente pelo backend se omitido, 
                        // ou podemos enviar o email como username se preferir.
                        username: email.split('@')[0] 
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    msgArea.style.color = 'green';
                    msgArea.textContent = 'Conta criada com sucesso! Redirecionando...';
                    
                    // Espera 2 segundos e manda para o login
                    setTimeout(() => {
                        window.location.href = '/api/users/login/';
                    }, 2000);
                } else {
                    msgArea.style.color = 'red';
                    msgArea.textContent = data.message || 'Erro ao cadastrar.';
                }
            } catch (error) {
                console.error('Erro:', error);
                msgArea.style.color = 'red';
                msgArea.textContent = 'Erro de conexão com o servidor.';
            }
        });
    </script>

</body>
</html>
