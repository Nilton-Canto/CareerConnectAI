{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CareerConnectAI</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <div class="login-container">
        <header>
            <h1>Acesse sua conta</h1>
        </header>

        <main>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Senha:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <div class="form-group">
                    <button type="submit" class="button-primary">Entrar</button>
                </div>
                <div id="error-msg" style="color: red; text-align: center; margin-top: 10px;"></div>
            </form>
        </main>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const errorMsg = document.getElementById('error-msg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault(); // Impede a página de recarregar
            errorMsg.textContent = 'Entrando...';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                // 1. Chama a API de Login (que testamos no Thunder Client)
                const response = await fetch('/api/users/login/token/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // 2. Sucesso! Salva o token no navegador
                    localStorage.setItem('authToken', data.token);
                    
                    // 3. Redireciona para o Dashboard
                    window.location.href = '/api/users/dashboard/';
                } else {
                    // Erro (senha errada, etc)
                    errorMsg.textContent = data.message || 'Erro ao fazer login.';
                }
            } catch (error) {
                console.error('Erro:', error);
                errorMsg.textContent = 'Erro de conexão com o servidor.';
            }
        });
    </script>

</body>
</html>
