{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - CareerConnectAI</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <header class="navbar">
        <div class="logo">CareerConnectAI</div>
        <nav>
            <a href="#" class="nav-link">Minhas Trilhas</a>
            <a href="#" class="nav-link">Explorar Áreas</a>
            <a href="#" id="btn-logout" class="btn-nav" style="background-color: #dc3545;">Sair</a>
        </nav>
    </header>

    <main class="dashboard-container">
        <h1>Bem-vindo ao seu Dashboard</h1>
        <p>Acompanhe sua evolução e descubra novos conhecimentos.</p>

        <h3>Minha Trilha Atual</h3>
        <div id="minha-trilha">
            <p>Carregando dados...</p>
        </div>

        <h3>Trilhas Disponíveis</h3>
        <div id="trilhas-disponiveis">
            <p>Carregando trilhas...</p>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // 1. VERIFICAÇÃO DE LOGIN
            const token = localStorage.getItem('authToken'); 
            if (!token) {
                window.location.href = '/api/users/login/';
                return;
            }

            // Função de Logout Simples
            document.getElementById('btn-logout').addEventListener('click', (e) => {
                e.preventDefault();
                localStorage.removeItem('authToken'); // Apaga o token
                window.location.href = '/api/users/login/'; // Manda para o login
            });

            const headers = {
                'Authorization': `Token ${token}`,
                'Content-Type': 'application/json'
            };

            const trilhasContainer = document.getElementById('trilhas-disponiveis');
            const minhaTrilhaContainer = document.getElementById('minha-trilha');
            let progressoId = null;

            // 2. BUSCAR TRILHAS
            function fetchTrilhas() {
                fetch('/api/trilhas/', { method: 'GET' })
                    .then(response => response.json())
                    .then(data => {
                        trilhasContainer.innerHTML = ''; 
                        data.forEach(trilha => {
                            const trilhaElement = document.createElement('div');
                            trilhaElement.className = 'trilha-card';
                            
                            let etapasHTML = '<ul>';
                            trilha.etapas.forEach(etapa => {
                                etapasHTML += `
                                    <li>
                                        <span>${etapa.titulo}</span>
                                        <button class="complete-btn" data-etapa-id="${etapa.id}">
                                            Concluir
                                        </button>
                                    </li>
                                `;
                            });
                            etapasHTML += '</ul>';

                            trilhaElement.innerHTML = `
                                <h4>${trilha.titulo}</h4>
                                <p>${trilha.descricao}</p>
                                ${etapasHTML}
                            `;
                            trilhasContainer.appendChild(trilhaElement);
                        });
                    })
                    .catch(error => console.error('Erro ao buscar trilhas:', error));
            }

            // 3. BUSCAR PROGRESSO
            function fetchProgresso() {
                fetch('/api/progressos/', { method: 'GET', headers: headers })
                    .then(response => response.json())
                    .then(data => {
                        const progresso = data[0]; 
                        
                        if (progresso) {
                            progressoId = progresso.id; 
                            minhaTrilhaContainer.innerHTML = `
                                <p><strong>Trilha Selecionada:</strong> ${progresso.trilha_selecionada || 'Nenhuma selecionada'}</p>
                                <p><strong>Etapas Concluídas (IDs):</strong> ${progresso.etapas_concluidas.join(', ') || 'Nenhuma'}</p>
                            `;
                        } else {
                            minhaTrilhaContainer.innerHTML = '<p>Você ainda não iniciou seu progresso.</p>';
                        }
                    })
                    .catch(error => console.error('Erro ao buscar progresso:', error));
            }

            // 4. MARCAR COMO CONCLUÍDA
            async function marcarEtapaConcluida(etapaId) {
                if (!progressoId) {
                    alert('Erro: Progresso do usuário não encontrado.');
                    return;
                }
                const url = `/api/progressos/${progressoId}/marcar_etapa_concluida/`;
                const body = JSON.stringify({ "etapa_id": etapaId });

                try {
                    const response = await fetch(url, { method: 'POST', headers: headers, body: body });
                    const data = await response.json();

                    if (response.ok) {
                        alert('Etapa concluída com sucesso!');
                        fetchProgresso(); 
                    } else {
                        alert(`Erro: ${data.erro}`);
                    }
                } catch (error) {
                    console.error('Erro ao marcar etapa:', error);
                }
            }

            // Event Listener
            trilhasContainer.addEventListener('click', (e) => {
                if (e.target.classList.contains('complete-btn')) {
                    const etapaId = e.target.getAttribute('data-etapa-id');
                    marcarEtapaConcluida(etapaId);
                }
            });

            // Inicialização
            fetchTrilhas();
            fetchProgresso();
        });
    </script>

</body>
</html>
